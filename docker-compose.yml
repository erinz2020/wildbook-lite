services:
  postgres:
    image: postgres:16-alpine
    container_name: wildbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wildbook
      POSTGRES_USER: wildbook
      POSTGRES_PASSWORD: wildbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildbook -d wildbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
