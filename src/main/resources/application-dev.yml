spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wildbook
    username: wildbook
    password: wildbook
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WildbookHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: dev-only-secret-please-replace-with-256-bit-random-string-in-production-xxxxxxxxxxxxxx
    expiration-minutes: 60
    refresh-lifetime-days: 30
  storage:
    media-dir: ./uploads
  scheduling:
    enabled: true
    token-cleanup-cron: "0 0 3 * * *"            # every day at 03:00
    notification-cleanup-cron: "0 0 4 * * *"     # every day at 04:00
    notification-retention-days: 30
  opensearch:
    enabled: false                # flip to true after `docker compose up opensearch`
    host: localhost
    port: 9200
    scheme: http
    index-name: encounters
    username: ""                  # security plugin disabled in dev
    password: ""
  mail:
    enabled: false                # flip to true once spring.mail.* points at a real SMTP relay
    from-address: noreply@wildbook-lite.local
    from-name: wildbook-lite
    max-attempts: 3               # @Retryable: total tries, NOT extra retries (3 = 1 + 2 retries)
    initial-backoff-millis: 1000  # exponential backoff: 1s, 2s, 4s, ...
