spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wildbook
    username: wildbook
    password: wildbook
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WildbookHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: dev-only-secret-please-replace-with-256-bit-random-string-in-production-xxxxxxxxxxxxxx
    expiration-minutes: 60
  storage:
    media-dir: ./uploads
